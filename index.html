<!DOCTYPE html>
<html>
  <head>
    <title>My Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        font-size: 18px;
        font-family: 'Lato', sans-serif;
        background-color: #1a1a1a;
        padding: 80px 60px;
      }

      .container {
        display: flex;
        align-items: center;
        gap: 40px;
      }

      img {
        width: 300px;
        height: 300px;
        object-fit: cover;
        border-radius: 50%;
        flex-shrink: 0;
      }

      p {
        font-size: 22px;
        color: #a0a0a0;
        font-family: 'Lato', sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="headshot.png" alt="Xiaofang Yang">
      <p>Hi, this is Xiaofang.</p>
    </div>
  </body>
</html>
