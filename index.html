<!DOCTYPE html>
<html>
  <head>
    <title>My Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        text-align: left;
        font-size: 18px;
        color: #ffffff;
        font-family: 'Lato', sans-serif;
        background-color: #1a1a1a;
        padding: 40px 60px;

      p {

  <body>
    <img src="headshot.png" alt="Xiaofang Yang">
